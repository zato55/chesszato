```html
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zato Chess - Neo</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

    <style>
        * { box-sizing: border-box; }

        .piece {
            user-select: none;
            -webkit-user-drag: none;
            pointer-events: none;
            width: 88%;
            height: 88%;
            object-fit: contain;
        }

        .square-light { background-color: #ffffff; }
        .square-dark { background-color: #a81c1c; }

        #board {
            display: grid;
            grid-template-columns: repeat(8, minmax(0, 1fr));
            grid-template-rows: repeat(8, minmax(0, 1fr));
            width: min(78vw, 80vh);
            height: min(78vw, 80vh);
            max-width: 720px;
            max-height: 720px;
            border: 4px solid #18181b;
            box-shadow: 0 0 35px rgba(37, 99, 235, .25);
        }

        #board > div {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            min-width: 0;
            min-height: 0;
        }

        #board > div.selected {
            box-shadow: inset 0 0 0 5px #2563eb !important;
            background-color: rgba(37, 99, 235, .35) !important;
        }

        #board > div:hover { filter: brightness(1.06); }

        @media (max-width: 640px) {
            #board {
                width: min(94vw, 58vh);
                height: min(94vw, 58vh);
            }
        }
    </style>
</head>

<body class="bg-[#09090b] text-white min-h-screen h-screen flex overflow-hidden font-sans">

    <aside class="w-16 md:w-60 bg-[#121215] border-r border-zinc-800/80 flex flex-col justify-between p-3.5 select-none flex-shrink-0 z-10">
        <div class="space-y-6">
            <div class="flex items-center gap-3 px-2 py-1">
                <div class="w-9 h-9 bg-red-700 rounded-lg flex items-center justify-center font-black text-xl text-white shadow-lg">Z</div>
                <span class="hidden md:inline font-extrabold text-lg tracking-wider text-blue-500">ZATO<span class="text-white">CHESS</span></span>
            </div>

            <nav class="space-y-1">
                <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-xl bg-blue-600 text-white font-semibold">
                    <span class="text-lg">♟</span>
                    <span class="hidden md:inline text-sm">Oyna</span>
                </a>
                <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-zinc-400 hover:bg-zinc-800/60 hover:text-white">
                    <span class="text-lg">🧩</span>
                    <span class="hidden md:inline text-sm">Bulmacalar</span>
                </a>
                <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-zinc-400 hover:bg-zinc-800/60 hover:text-white">
                    <span class="text-lg">🎓</span>
                    <span class="hidden md:inline text-sm">Öğren</span>
                </a>
                <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-zinc-400 hover:bg-zinc-800/60 hover:text-white">
                    <span class="text-lg">📊</span>
                    <span class="hidden md:inline text-sm">Analiz</span>
                </a>
            </nav>
        </div>

        <div class="space-y-2 border-t border-zinc-800/80 pt-3">
            <button class="w-full flex items-center justify-center md:justify-start gap-3 px-3 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-bold text-sm">
                <span>🔑</span><span class="hidden md:inline">Giriş Yap</span>
            </button>
            <button class="w-full flex items-center justify-center md:justify-start gap-3 px-3 py-2.5 rounded-xl bg-red-700 hover:bg-red-600 text-white font-bold text-sm">
                <span>✨</span><span class="hidden md:inline">Kayıt Ol</span>
            </button>
            <a href="#" class="flex items-center gap-3 px-3 py-2 rounded-xl text-zinc-400 hover:bg-zinc-800/60 pt-2">
                <span class="text-lg">⚙️</span><span class="hidden md:inline text-xs">Ayarlar</span>
            </a>
        </div>
    </aside>

    <main class="flex-1 flex flex-col lg:flex-row items-center justify-center p-3 lg:p-8 gap-5 lg:gap-8 overflow-y-auto">
        <div class="flex items-center justify-center flex-shrink-0">
            <div id="board" class="rounded-xl overflow-hidden"></div>
        </div>

        <section class="w-full lg:w-80 min-h-[420px] lg:h-[min(78vw,80vh)] max-h-[720px] bg-[#121215] p-5 lg:p-6 rounded-2xl border border-zinc-800/80 shadow-2xl flex flex-col justify-between flex-shrink-0">
            <div>
                <div class="flex items-center justify-between border-b border-zinc-800 pb-4 mb-4 gap-2">
                    <h2 class="text-base font-bold text-zinc-200">Canlı Karşılaşma</h2>
                    <span id="status" class="text-xs font-semibold px-3 py-1 rounded-full bg-blue-950 text-blue-400 border border-blue-800/50 whitespace-nowrap">Sıra: Beyaz</span>
                </div>

                <h3 class="text-xs uppercase tracking-wider text-zinc-500 font-bold mb-2">Hamle Geçmişi</h3>
                <div id="pgn" class="h-60 lg:h-72 overflow-y-auto bg-[#09090b] p-3 rounded-xl border border-zinc-800/60 text-xs font-mono text-zinc-400 leading-relaxed"></div>
            </div>

            <div class="flex gap-3 pt-4 mt-4 border-t border-zinc-800">
                <button id="resetBtn" class="flex-1 bg-red-700 hover:bg-red-600 active:scale-95 text-white font-bold py-3 px-4 rounded-xl text-sm">Yeni Oyun</button>
                <button id="undoBtn" class="flex-1 bg-blue-700 hover:bg-blue-600 active:scale-95 text-white font-bold py-3 px-4 rounded-xl text-sm">Geri Al</button>
            </div>
        </section>
    </main>

    <script>
        const game = new Chess();
        let selectedSquare = null;

        // Chess.com Neo taş görselleri.
        // Dış kaynaklı bağlantılar oldukları için internet erişimi gerekir.
        const pieceSVG = {
            K: 'https://images.chesscomfiles.com/chess-themes/pieces/neo/300/wk.png',
            Q: 'https://images.chesscomfiles.com/chess-themes/pieces/neo/300/wq.png',
            R: 'https://images.chesscomfiles.com/chess-themes/pieces/neo/300/wr.png',
            B: 'https://images.chesscomfiles.com/chess-themes/pieces/neo/300/wb.png',
            N: 'https://images.chesscomfiles.com/chess-themes/pieces/neo/300/wn.png',
            P: 'https://images.chesscomfiles.com/chess-themes/pieces/neo/300/wp.png',

            k: 'https://images.chesscomfiles.com/chess-themes/pieces/neo/300/bk.png',
            q: 'https://images.chesscomfiles.com/chess-themes/pieces/neo/300/bq.png',
            r: 'https://images.chesscomfiles.com/chess-themes/pieces/neo/300/br.png',
            b: 'https://images.chesscomfiles.com/chess-themes/pieces/neo/300/bb.png',
            n: 'https://images.chesscomfiles.com/chess-themes/pieces/neo/300/bn.png',
            p: 'https://images.chesscomfiles.com/chess-themes/pieces/neo/300/bp.png'
        };

        function renderBoard() {
            const $board = $('#board');
            $board.empty();

            const boardState = game.board();

            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const file = String.fromCharCode(97 + c);
                    const rank = 8 - r;
                    const squareName = file + rank;
                    const piece = boardState[r][c];
                    const isLight = (r + c) % 2 === 0;

                    const $square = $('<div></div>')
                        .addClass('w-full h-full flex items-center justify-center select-none')
                        .addClass(isLight ? 'square-light' : 'square-dark')
                        .attr('data-square', squareName);

                    if (selectedSquare === squareName) {
                        $square.addClass('selected');
                    }

                    if (piece) {
                        const key = piece.color === 'w'
                            ? piece.type.toUpperCase()
                            : piece.type;

                        const $img = $('<img>')
                            .attr('src', pieceSVG[key])
                            .attr('alt', key)
                            .addClass('piece');

                        $img.on('error', function () {
                            $(this).attr('alt', 'Taş görseli yüklenemedi');
                        });

                        $square.append($img);
                    }

                    $board.append($square);
                }
            }
        }

        $('#board').on('click', 'div[data-square]', function () {
            const square = $(this).attr('data-square');

            if (!selectedSquare) {
                const piece = game.get(square);

                if (piece && piece.color === game.turn()) {
                    selectedSquare = square;
                    renderBoard();
                }

                return;
            }

            const move = game.move({
                from: selectedSquare,
                to: square,
                promotion: 'q'
            });

            selectedSquare = null;

            if (move === null) {
                const piece = game.get(square);

                if (piece && piece.color === game.turn()) {
                    selectedSquare = square;
                }
            }

            renderBoard();
            updateStatus();
        });

        function updateStatus() {
            const moveColor = game.turn() === 'b' ? 'Siyah' : 'Beyaz';

            if (game.in_checkmate()) {
                $('#status').text('Şah Mat!');
            } else if (game.in_draw()) {
                $('#status').text('Berabere');
            } else {
                let statusText = 'Sıra: ' + moveColor;

                if (game.in_check()) {
                    statusText = moveColor + ' (Şah!)';
                }

                $('#status').text(statusText);
            }

            const moves = game.history({ verbose: true });
            let pgnHtml = '';

            for (let i = 0; i < moves.length; i += 2) {
                const round = Math.floor(i / 2) + 1;
                const whiteMove = moves[i].from + '→' + moves[i].to;
                const blackMove = moves[i + 1]
                    ? moves[i + 1].from + '→' + moves[i + 1].to
                    : '';

                pgnHtml += `
                    <div class="py-1.5 border-b border-zinc-800/50 flex justify-between gap-2">
                        <span class="text-zinc-600 font-semibold">${round}.</span>
                        <span class="text-zinc-300 font-medium">${whiteMove}</span>
                        <span class="text-blue-400 font-medium">${blackMove}</span>
                    </div>`;
            }

            $('#pgn').html(pgnHtml);

            const pgnDiv = document.getElementById('pgn');

            if (pgnDiv) {
                pgnDiv.scrollTop = pgnDiv.scrollHeight;
            }
        }

        $('#resetBtn').on('click', function () {
            game.reset();
            selectedSquare = null;
            renderBoard();
            updateStatus();
        });

        $('#undoBtn').on('click', function () {
            game.undo();
            selectedSquare = null;
            renderBoard();
            updateStatus();
        });

        renderBoard();
        updateStatus();
    </script>
</body>
</html>
