<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zato Chess - Pro Web App & Analysis Engine</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

    <style>
        .piece {
            user-select: none;
            -webkit-user-drag: none;
            pointer-events: none;
            width: 88%;
            height: 88%;
            object-fit: contain;
            /* Akıcı Taş Kayma Animasyonu */
            transition: transform 0.15s ease-in-out, opacity 0.12s ease;
        }

        .square-light { background-color: #ffffff; }
        .square-dark { background-color: #a81c1c; }

        #board-wrapper {
            position: relative;
            width: min(78vw, 80vh);
            height: min(78vw, 80vh);
            max-width: 720px;
            max-height: 720px;
        }

        #board {
            display: grid;
            grid-template-columns: repeat(8, minmax(0, 1fr));
            grid-template-rows: repeat(8, minmax(0, 1fr));
            width: 100%;
            height: 100%;
            border: 4px solid #18181b;
            box-shadow: 0 0 35px rgba(37, 99, 235, .25);
        }

        #board > div {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            min-width: 0;
            min-height: 0;
        }

        /* Seçili Taş Karesi - Şeffaf Zarif Mavi */
        #board > div.selected {
            box-shadow: inset 0 0 0 3px #2563eb !important;
            background-color: rgba(37, 99, 235, 0.2) !important;
        }

        /* Son Hamle Vurgusu - Çok Şeffaf, Temaya Uyumlu Yumuşak Dokunuş */
        #board > div.last-move-highlight {
            background-color: rgba(37, 99, 235, 0.22) !important;
            box-shadow: inset 0 0 0 1px rgba(37, 99, 235, 0.35) !important;
        }

        #board > div:hover { filter: brightness(1.05); }

        .active-move {
            background-color: #2563eb !important;
            color: #ffffff !important;
            font-weight: bold;
            border-radius: 6px;
        }

        /* SVG Ok Katmanı */
        #arrowOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 20;
        }

        @media (max-width: 640px) {
            #board-wrapper {
                width: min(94vw, 58vh);
                height: min(94vw, 58vh);
            }
        }
    </style>
</head>

<body class="bg-[#09090b] text-white min-h-screen h-screen flex overflow-hidden font-sans relative">

    <!-- SOL MENÜ -->
    <aside class="w-16 md:w-60 bg-[#121215] border-r border-zinc-800/80 flex flex-col justify-between p-3.5 select-none flex-shrink-0 z-10">
        <div class="space-y-6">
            <div class="flex items-center gap-3 px-2 py-1">
                <div class="w-9 h-9 bg-red-700 rounded-lg flex items-center justify-center font-black text-xl text-white shadow-lg">Z</div>
                <span class="hidden md:inline font-extrabold text-lg tracking-wider text-blue-500">ZATO<span class="text-white">CHESS</span></span>
            </div>

            <nav class="space-y-1">
                <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-xl bg-blue-600 text-white font-semibold">
                    <span class="text-lg">♟</span>
                    <span class="hidden md:inline text-sm">Oyna</span>
                </a>
                <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-zinc-400 hover:bg-zinc-800/60 hover:text-white">
                    <span class="text-lg">🧩</span>
                    <span class="hidden md:inline text-sm">Bulmacalar</span>
                </a>
                <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-zinc-400 hover:bg-zinc-800/60 hover:text-white">
                    <span class="text-lg">🎓</span>
                    <span class="hidden md:inline text-sm">Öğren</span>
                </a>
                <a href="#" id="navAnalysis" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-zinc-400 hover:bg-zinc-800/60 hover:text-white">
                    <span class="text-lg">📊</span>
                    <span class="hidden md:inline text-sm">Analiz</span>
                </a>
            </nav>
        </div>

        <div class="space-y-2 border-t border-zinc-800/80 pt-3">
            <button class="w-full flex items-center justify-center md:justify-start gap-3 px-3 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-bold text-sm">
                <span>🔑</span><span class="hidden md:inline">Giriş Yap</span>
            </button>
            <button class="w-full flex items-center justify-center md:justify-start gap-3 px-3 py-2.5 rounded-xl bg-red-700 hover:bg-red-600 text-white font-bold text-sm">
                <span>✨</span><span class="hidden md:inline">Kayıt Ol</span>
            </button>
            <a href="#" class="flex items-center gap-3 px-3 py-2 rounded-xl text-zinc-400 hover:bg-zinc-800/60 pt-2">
                <span class="text-lg">⚙️</span><span class="hidden md:inline text-xs">Ayarlar</span>
            </a>
        </div>
    </aside>

    <!-- ANA İÇERİK -->
    <main class="flex-1 flex flex-col lg:flex-row items-center justify-center p-3 lg:p-8 gap-5 lg:gap-8 overflow-y-auto">
        
        <!-- EVAL BAR + BOARD WRAPPER -->
        <div class="flex items-center justify-center gap-3 flex-shrink-0">
            <!-- Stockfish Eval Bar -->
            <div id="evalBarWrapper" class="hidden w-4 h-[min(78vw,80vh)] max-h-[720px] bg-zinc-800 rounded-full overflow-hidden flex flex-col justify-end border border-zinc-700 shadow-lg">
                <div id="evalBarWhite" class="w-full bg-white transition-all duration-300" style="height: 50%;"></div>
            </div>

            <!-- Satranç Tahtası ve Ok Katmanı -->
            <div id="board-wrapper" class="rounded-xl overflow-hidden">
                <div id="board"></div>
                <svg id="arrowOverlay">
                    <defs>
                        <marker id="arrowhead" markerWidth="6" markerHeight="6" refX="4" refY="3" orient="auto">
                            <polygon points="0 0, 6 3, 0 6" fill="#22c55e" />
                        </marker>
                    </defs>
                </svg>
            </div>
        </div>

        <section class="w-full lg:w-80 min-h-[480px] lg:h-[min(78vw,80vh)] max-h-[720px] bg-[#121215] p-5 lg:p-6 rounded-2xl border border-zinc-800/80 shadow-2xl flex flex-col justify-between flex-shrink-0">
            <div class="space-y-3">
                <!-- Üst Panel -->
                <div class="flex items-center justify-between border-b border-zinc-800 pb-3 gap-2">
                    <h2 id="panelTitle" class="text-base font-bold text-zinc-200">Canlı Karşılaşma</h2>
                    <span id="status" class="text-xs font-semibold px-3 py-1 rounded-full bg-blue-950 text-blue-400 border border-blue-800/50 whitespace-nowrap">Sıra: Beyaz</span>
                </div>

                <!-- Mod Seçimi -->
                <div id="modeWrapper" class="flex gap-2 bg-[#09090b] p-1 rounded-xl border border-zinc-800/60 text-xs">
                    <button id="modePvP" class="flex-1 py-1.5 rounded-lg bg-blue-600 font-bold text-white transition">2 Kişilik</button>
                    <button id="modeBot" class="flex-1 py-1.5 rounded-lg text-zinc-400 hover:text-white transition">Stockfish Bot</button>
                </div>

                <!-- Bot Seviyesi -->
                <div id="botEloWrapper" class="hidden flex justify-between items-center bg-[#09090b] px-3 py-1.5 rounded-xl border border-zinc-800/60 text-xs">
                    <span class="text-zinc-400 font-medium">Bot Seviyesi:</span>
                    <select id="botElo" class="bg-[#121215] text-blue-400 font-bold px-2 py-1 rounded border border-zinc-700 outline-none cursor-pointer">
                        <option value="1200">1200 Elo (Acemi)</option>
                        <option value="1400" selected>1400 Elo (Orta)</option>
                        <option value="1600">1600 Elo (İleri)</option>
                        <option value="1800">1800 Elo (Usta)</option>
                    </select>
                </div>

                <!-- Süre Göstergeleri -->
                <div id="timerWrapper" class="flex justify-between items-center bg-[#09090b] px-3 py-2 rounded-xl border border-zinc-800/60 text-xs">
                    <div class="text-zinc-400">⏱️ Beyaz: <span id="whiteTimer" class="font-mono text-white font-bold">--:--</span></div>
                    <div class="text-zinc-400">Siyah: <span id="blackTimer" class="font-mono text-white font-bold">--:--</span></div>
                </div>

                <!-- CANLI GEÇMİŞ İNCELEME UYARISI -->
                <div id="liveReviewBanner" class="hidden bg-amber-950/60 border border-amber-800/60 text-amber-300 p-2 rounded-xl text-xs flex justify-between items-center">
                    <span>🔍 Geçmiş Hamle Bakılıyor</span>
                    <button id="returnLiveBtn" class="bg-amber-600 hover:bg-amber-500 text-white font-bold px-2 py-1 rounded text-[10px]">Canlıya Dön</button>
                </div>

                <!-- STOCKFISH ANALİZ TAVSİYE KARTI -->
                <div id="bestMoveCard" class="hidden bg-[#09090b] p-3 rounded-xl border border-emerald-900/60 text-xs space-y-1.5">
                    <div class="flex items-center justify-between">
                        <span class="text-emerald-400 font-bold flex items-center gap-1.5">💡 Stockfish Tavsiyesi</span>
                        <span id="evalScoreText" class="font-mono font-bold text-zinc-300">+0.0</span>
                    </div>
                    <div class="text-zinc-300 font-mono" id="bestMoveText">En İyi Hamle: --</div>
                    <button id="playBestMoveBtn" class="w-full bg-emerald-700 hover:bg-emerald-600 active:scale-95 text-white font-bold py-1.5 rounded-lg text-xs transition mt-1">
                        ⚡ En İyi Hamleyi Oyna
                    </button>
                </div>

                <!-- Hamle Geçmişi -->
                <h3 class="text-xs uppercase tracking-wider text-zinc-500 font-bold pt-1">Hamle Geçmişi</h3>
                <div id="pgn" class="h-32 lg:h-36 overflow-y-auto bg-[#09090b] p-3 rounded-xl border border-zinc-800/60 text-xs font-mono text-zinc-400 leading-relaxed"></div>
            </div>

            <!-- ANALİZ NAVİGASYON BUTONLARI -->
            <div id="analysisNav" class="hidden space-y-2 pt-3 border-t border-zinc-800">
                <div class="grid grid-cols-4 gap-1.5">
                    <button id="navStart" class="bg-zinc-800 hover:bg-zinc-700 text-white font-bold py-2 rounded-lg text-xs transition">⏮️</button>
                    <button id="navPrev" class="bg-zinc-800 hover:bg-zinc-700 text-white font-bold py-2 rounded-lg text-xs transition">◀️</button>
                    <button id="navNext" class="bg-zinc-800 hover:bg-zinc-700 text-white font-bold py-2 rounded-lg text-xs transition">▶️</button>
                    <button id="navEnd" class="bg-zinc-800 hover:bg-zinc-700 text-white font-bold py-2 rounded-lg text-xs transition">⏭️</button>
                </div>
                <button id="exitAnalysisBtn" class="w-full bg-blue-700 hover:bg-blue-600 text-white font-bold py-2 rounded-xl text-xs transition">
                    🎮 Oynamaya Dön
                </button>
            </div>

            <!-- OYUN KONTROL BUTONLARI -->
            <div id="normalControls" class="space-y-2 pt-3 border-t border-zinc-800">
                <div class="flex gap-2">
                    <button id="flipBtn" class="flex-1 bg-zinc-800 hover:bg-zinc-700 text-zinc-200 font-bold py-2 px-3 rounded-xl text-xs transition">🔄 Tahtayı Çevir</button>
                    <button id="undoBtn" class="flex-1 bg-blue-700 hover:bg-blue-600 text-white font-bold py-2 px-3 rounded-xl text-xs transition">↩️ Geri Al</button>
                </div>
                <button id="resetBtn" class="w-full bg-red-700 hover:bg-red-600 active:scale-95 text-white font-bold py-2.5 px-4 rounded-xl text-sm transition">Yeni Oyun Başlat</button>
            </div>
        </section>
    </main>

    <!-- OYUN SONU BİLDİRİM MODAL -->
    <div id="gameOverModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-[#121215] border-2 border-zinc-800 rounded-3xl p-6 lg:p-8 max-w-sm w-full text-center shadow-2xl space-y-5 relative animate-in fade-in zoom-in duration-200">
            <button id="closeModalBtn" class="absolute top-4 right-4 text-zinc-400 hover:text-white text-xl font-bold p-1 transition">✕</button>

            <div id="modalIcon" class="text-6xl pt-2">🏆</div>
            <div>
                <h3 id="modalTitle" class="text-2xl font-black text-white tracking-wide mb-1">Tebrikler!</h3>
                <p id="modalReason" class="text-sm text-zinc-400 font-medium">Şah mat ile oyunu kazandınız.</p>
            </div>

            <div class="flex flex-col gap-2 pt-2">
                <button id="modalResetBtn" class="w-full bg-blue-600 hover:bg-blue-500 active:scale-95 text-white font-extrabold py-3 px-6 rounded-xl text-sm transition shadow-lg shadow-blue-950/50">
                    Yeni Oyun Başlat
                </button>
                <button id="modalInspectBtn" class="w-full bg-zinc-800 hover:bg-zinc-700 active:scale-95 text-zinc-300 font-bold py-2.5 px-6 rounded-xl text-xs transition">
                    🔍 Tahtayı İncele (Analiz Modu)
                </button>
            </div>
        </div>
    </div>

    <script>
        const game = new Chess();
        const reviewGame = new Chess();
        const analysisGame = new Chess();
        
        let selectedSquare = null;
        let isFlipped = false;
        let vsBot = false;
        let timerInterval = null;
        let whiteTime = 300, blackTime = 300;
        let stockfishWorker = null;

        // Canlı Oyun İnceleme
        let liveReviewIdx = -1;

        // Analiz Değişkenleri
        let isAnalysisMode = false;
        let moveHistoryList = [];
        let currentAnalysisIdx = -1;
        let currentBestMove = null;

        const pieceSVG = {
            K: 'https://images.chesscomfiles.com/chess-themes/pieces/neo/300/wk.png',
            Q: 'https://images.chesscomfiles.com/chess-themes/pieces/neo/300/wq.png',
            R: 'https://images.chesscomfiles.com/chess-themes/pieces/neo/300/wr.png',
            B: 'https://images.chesscomfiles.com/chess-themes/pieces/neo/300/wb.png',
            N: 'https://images.chesscomfiles.com/chess-themes/pieces/neo/300/wn.png',
            P: 'https://images.chesscomfiles.com/chess-themes/pieces/neo/300/wp.png',

            k: 'https://images.chesscomfiles.com/chess-themes/pieces/neo/300/bk.png',
            q: 'https://images.chesscomfiles.com/chess-themes/pieces/neo/300/bq.png',
            r: 'https://images.chesscomfiles.com/chess-themes/pieces/neo/300/br.png',
            b: 'https://images.chesscomfiles.com/chess-themes/pieces/neo/300/bb.png',
            n: 'https://images.chesscomfiles.com/chess-themes/pieces/neo/300/bn.png',
            p: 'https://images.chesscomfiles.com/chess-themes/pieces/neo/300/bp.png'
        };

        function initStockfish() {
            try {
                const blob = new Blob([
                    "importScripts('https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js');"
                ], { type: 'application/javascript' });
                
                stockfishWorker = new Worker(URL.createObjectURL(blob));

                stockfishWorker.onmessage = function (event) {
                    const message = event.data;
                    if (typeof message === 'string') {
                        // Bot Oyun Hamlesi
                        if (message.startsWith('bestmove')) {
                            const moveStr = message.split(' ')[1];
                            if (isAnalysisMode && moveStr && moveStr !== '(none)') {
                                currentBestMove = moveStr;
                                $('#bestMoveText').text(`En İyi Hamle: ${moveStr.substring(0,2)} → ${moveStr.substring(2,4)}`);
                                drawBestMoveArrow(moveStr.substring(0,2), moveStr.substring(2,4));
                            } else if (!isAnalysisMode && moveStr && vsBot && game.turn() === 'b' && !game.game_over()) {
                                const from = moveStr.substring(0, 2);
                                const to = moveStr.substring(2, 4);
                                const promotion = moveStr.length > 4 ? moveStr.substring(4, 5) : 'q';

                                const targetPiece = game.get(to);
                                game.move({ from: from, to: to, promotion: promotion });
                                playSound(targetPiece !== null);
                                renderBoard();
                                updateStatus();
                            }
                        }

                        // Eval Bar & Skor Hesaplama
                        if (message.includes('score cp') && isAnalysisMode) {
                            const parts = message.split(' ');
                            const cpIdx = parts.indexOf('cp');
                            if (cpIdx !== -1 && parts[cpIdx + 1]) {
                                let score = parseInt(parts[cpIdx + 1]);
                                if (analysisGame.turn() === 'b') score = -score;
                                updateEvalBar(score);
                            }
                        }
                    }
                };
            } catch (e) {
                console.error("Stockfish başlatılamadı:", e);
            }
        }

        function updateEvalBar(scoreCp) {
            let evalVal = (scoreCp / 100).toFixed(1);
            if (evalVal > 0) evalVal = '+' + evalVal;
            $('#evalScoreText').text(evalVal);

            let percentage = 50 + (scoreCp / 15);
            percentage = Math.max(5, Math.min(95, percentage));
            $('#evalBarWhite').css('height', percentage + '%');
        }

        function drawBestMoveArrow(fromSquare, toSquare) {
            clearArrow();
            const getSquareCenter = (sq) => {
                const file = sq.charCodeAt(0) - 97;
                const rank = 8 - parseInt(sq.charAt(1));
                const col = isFlipped ? 7 - file : file;
                const row = isFlipped ? 7 - rank : rank;
                return {
                    x: (col + 0.5) * 12.5 + '%',
                    y: (row + 0.5) * 12.5 + '%'
                };
            };

            const start = getSquareCenter(fromSquare);
            const end = getSquareCenter(toSquare);

            const svgNS = "http://www.w3.org/2000/svg";
            const line = document.createElementNS(svgNS, "line");
            line.setAttribute("x1", start.x);
            line.setAttribute("y1", start.y);
            line.setAttribute("x2", end.x);
            line.setAttribute("y2", end.y);
            line.setAttribute("stroke", "#22c55e");
            line.setAttribute("stroke-width", "5");
            line.setAttribute("stroke-linecap", "round");
            line.setAttribute("marker-end", "url(#arrowhead)");
            line.setAttribute("id", "activeBestArrow");

            document.getElementById("arrowOverlay").appendChild(line);
        }

        function clearArrow() {
            const oldLine = document.getElementById("activeBestArrow");
            if (oldLine) oldLine.remove();
        }

        function playSound(isCapture = false) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);

                if (isCapture) {
                    osc.frequency.setValueAtTime(150, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(40, ctx.currentTime + 0.08);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                } else {
                    osc.frequency.setValueAtTime(300, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(120, ctx.currentTime + 0.05);
                    gain.gain.setValueAtTime(0.15, ctx.currentTime);
                }

                osc.start();
                osc.stop(ctx.currentTime + 0.08);
            } catch (e) {}
        }

        function renderBoard() {
            const $board =$('#board');
            $board.empty();

            let activeEngine = game;
            let lastMove = null;

            if (isAnalysisMode) {
                activeEngine = analysisGame;
                if (currentAnalysisIdx >= 0 && moveHistoryList[currentAnalysisIdx]) {
                    lastMove = moveHistoryList[currentAnalysisIdx];
                }
            } else if (liveReviewIdx !== -1) {
                const historyVerbose = game.history({ verbose: true });
                reviewGame.reset();
                for (let i = 0; i <= liveReviewIdx; i++) {
                    if (historyVerbose[i]) reviewGame.move(historyVerbose[i]);
                }
                activeEngine = reviewGame;
                if (liveReviewIdx >= 0 && historyVerbose[liveReviewIdx]) {
                    lastMove = historyVerbose[liveReviewIdx];
                }
            } else {
                const historyVerbose = game.history({ verbose: true });
                if (historyVerbose.length > 0) {
                    lastMove = historyVerbose[historyVerbose.length - 1];
                }
            }

            const boardState = activeEngine.board();

            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const rowIdx = isFlipped ? 7 - r : r;
                    const colIdx = isFlipped ? 7 - c : c;

                    const file = String.fromCharCode(97 + colIdx);
                    const rank = 8 - rowIdx;
                    const squareName = file + rank;
                    const piece = boardState[rowIdx][colIdx];
                    const isLight = (rowIdx + colIdx) % 2 === 0;

                    const $square =$('<div></div>')
                        .addClass('w-full h-full flex items-center justify-center select-none')
                        .addClass(isLight ? 'square-light' : 'square-dark')
                        .attr('data-square', squareName);

                    if (selectedSquare === squareName) {
                        $square.addClass('selected');
                    }

                    // Dinamik ve Şeffaf Son Hamle Vurgulaması
                    if (lastMove && (squareName === lastMove.from || squareName === lastMove.to)) {
                        $square.addClass('last-move-highlight');
                    }

                    if (piece) {
                        const key = piece.color === 'w' ? piece.type.toUpperCase() : piece.type;
                        const $img =$('<img>').attr('src', pieceSVG[key]).addClass('piece');
                        $square.append($img);
                    }

                    $board.append($square);
                }
            }
        }

        function handleMove(from, to) {
            if (isAnalysisMode) return;

            if (liveReviewIdx !== -1) {
                returnToLive();
            }

            const targetPiece = game.get(to);
            const move = game.move({ from: from, to: to, promotion: 'q' });

            if (move !== null) {
                playSound(targetPiece !== null);
                selectedSquare = null;
                renderBoard();
                updateStatus();
                startTimer();

                if (vsBot && game.turn() === 'b' && !game.game_over()) {
                    triggerStockfishMove();
                }
            } else {
                const piece = game.get(to);
                if (piece && piece.color === game.turn()) {
                    selectedSquare = to;
                } else {
                    selectedSquare = null;
                }
                renderBoard();
            }
        }

        function triggerStockfishMove() {
            if (!stockfishWorker) return;

            const elo = parseInt($('#botElo').val()) || 1400;
            const fen = game.fen();

            let depth = 3;
            if (elo >= 1400) depth = 5;
            if (elo >= 1600) depth = 8;
            if (elo >= 1800) depth = 12;

            stockfishWorker.postMessage('position fen ' + fen);
            stockfishWorker.postMessage('go depth ' + depth);
        }

        $('#board').on('click', 'div[data-square]', function () {
            if (isAnalysisMode) return;
            const square = $(this).attr('data-square');

            if (!selectedSquare) {
                const piece = game.get(square);
                if (piece && piece.color === game.turn()) {
                    selectedSquare = square;
                    renderBoard();
                }
            } else {
                handleMove(selectedSquare, square);
            }
        });

        function returnToLive() {
            liveReviewIdx = -1;
            $('#liveReviewBanner').addClass('hidden');
            renderBoard();
            updateStatus();
        }

        $('#returnLiveBtn').on('click', returnToLive);

        // ANALİZ MODU
        function startAnalysisMode() {
            isAnalysisMode = true;
            liveReviewIdx = -1;
            $('#liveReviewBanner').addClass('hidden');
            $('#gameOverModal').addClass('hidden');
            $('#modeWrapper, #botEloWrapper, #timerWrapper, #normalControls').addClass('hidden');
            $('#analysisNav, #evalBarWrapper, #bestMoveCard').removeClass('hidden');
            $('#panelTitle').text('🔍 Maç Analizi');
            $('#status').text('Analiz Modu');

            moveHistoryList = game.history({ verbose: true });
            currentAnalysisIdx = moveHistoryList.length - 1;
            
            updateAnalysisBoard();
        }

        function exitAnalysisMode() {
            isAnalysisMode = false;
            clearArrow();
            $('#analysisNav, #evalBarWrapper, #bestMoveCard').addClass('hidden');
            $('#modeWrapper, #timerWrapper, #normalControls').removeClass('hidden');
            if (vsBot) $('#botEloWrapper').removeClass('hidden');
            $('#panelTitle').text('Canlı Karşılaşma');
            
            renderBoard();
            updateStatus();
        }

        function updateAnalysisBoard() {
            clearArrow();
            analysisGame.reset();
            for (let i = 0; i <= currentAnalysisIdx; i++) {
                if (moveHistoryList[i]) {
                    analysisGame.move(moveHistoryList[i]);
                }
            }

            renderBoard();
            renderAnalysisPGN();

            if (stockfishWorker) {
                stockfishWorker.postMessage('position fen ' + analysisGame.fen());
                stockfishWorker.postMessage('go depth 12');
            }
        }

        function renderAnalysisPGN() {
            let pgnHtml = '';
            for (let i = 0; i < moveHistoryList.length; i += 2) {
                const round = Math.floor(i / 2) + 1;
                const whiteActive = (i === currentAnalysisIdx) ? 'active-move px-1.5 py-0.5' : '';
                const blackActive = (i + 1 === currentAnalysisIdx) ? 'active-move px-1.5 py-0.5' : '';

                const whiteMove = moveHistoryList[i].from + '→' + moveHistoryList[i].to;
                const blackMove = moveHistoryList[i + 1] ? moveHistoryList[i + 1].from + '→' + moveHistoryList[i + 1].to : '';

                pgnHtml += `
                    <div class="py-1.5 border-b border-zinc-800/50 flex justify-between gap-2 items-center">
                        <span class="text-zinc-600 font-semibold">${round}.</span>
                        <span class="text-zinc-300 font-medium cursor-pointer ${whiteActive}" onclick="jumpToMove(${i})">${whiteMove}</span>
                        <span class="text-blue-400 font-medium cursor-pointer ${blackActive}" onclick="jumpToMove(${i + 1})">${blackMove}</span>
                    </div>`;
            }

            $('#pgn').html(pgnHtml);
        }

        window.jumpToMove = function(idx) {
            if (isAnalysisMode) {
                if (idx >= -1 && idx < moveHistoryList.length) {
                    currentAnalysisIdx = idx;
                    updateAnalysisBoard();
                }
            } else {
                const moves = game.history({ verbose: true });
                if (idx >= 0 && idx < moves.length) {
                    if (idx === moves.length - 1) {
                        returnToLive();
                    } else {
                        liveReviewIdx = idx;
                        $('#liveReviewBanner').removeClass('hidden');
                        renderBoard();
                        updateStatus();
                    }
                }
            }
        };

        $('#playBestMoveBtn').on('click', function() {
            if (currentBestMove && isAnalysisMode) {
                const from = currentBestMove.substring(0, 2);
                const to = currentBestMove.substring(2, 4);
                const move = analysisGame.move({ from: from, to: to, promotion: 'q' });
                if (move) {
                    playSound(true);
                    renderBoard();
                    if (stockfishWorker) {
                        stockfishWorker.postMessage('position fen ' + analysisGame.fen());
                        stockfishWorker.postMessage('go depth 12');
                    }
                }
            }
        });

        $(document).on('keydown', function(e) {
            if (isAnalysisMode) {
                if (e.key === 'ArrowLeft') $('#navPrev').click();
                if (e.key === 'ArrowRight') $('#navNext').click();
            } else {
                const moves = game.history({ verbose: true });
                if (moves.length === 0) return;

                if (e.key === 'ArrowLeft') {
                    if (liveReviewIdx === -1) {
                        liveReviewIdx = moves.length - 2;
                    } else if (liveReviewIdx > 0) {
                        liveReviewIdx--;
                    }
                    if (liveReviewIdx >= 0) {
                        $('#liveReviewBanner').removeClass('hidden');
                        renderBoard();
                        updateStatus();
                    }
                } else if (e.key === 'ArrowRight') {
                    if (liveReviewIdx !== -1) {
                        if (liveReviewIdx < moves.length - 1) {
                            liveReviewIdx++;
                            renderBoard();
                            updateStatus();
                        } else {
                            returnToLive();
                        }
                    }
                }
            }
        });

        $('#navStart').on('click', () => { currentAnalysisIdx = -1; updateAnalysisBoard(); });
        $('#navPrev').on('click', () => { if (currentAnalysisIdx > -1) { currentAnalysisIdx--; updateAnalysisBoard(); } });
        $('#navNext').on('click', () => { if (currentAnalysisIdx < moveHistoryList.length - 1) { currentAnalysisIdx++; updateAnalysisBoard(); } });
        $('#navEnd').on('click', () => { currentAnalysisIdx = moveHistoryList.length - 1; updateAnalysisBoard(); });
        $('#exitAnalysisBtn').on('click', exitAnalysisMode);

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (game.game_over() || isAnalysisMode) { clearInterval(timerInterval); return; }
                if (game.turn() === 'w') {
                    if (whiteTime > 0) {
                        whiteTime--;
                    } else {
                        showGameOverModal('Siyah Kazandı!', 'Beyaz oyuncunun süresi bitti.', '⏳');
                        clearInterval(timerInterval);
                    }
                } else {
                    if (blackTime > 0) {
                        blackTime--;
                    } else {
                        showGameOverModal('Beyaz Kazandı!', 'Siyah oyuncunun süresi bitti.', '⏳');
                        clearInterval(timerInterval);
                    }
                }
                updateTimerDisplay();
            }, 1000);
        }

        function updateTimerDisplay() {
            const format = (s) => `${Math.floor(s/60).toString().padStart(2,'0')}:${(s%60).toString().padStart(2,'0')}`;
            $('#whiteTimer').text(format(whiteTime));
            $('#blackTimer').text(format(blackTime));
        }

        function showGameOverModal(title, reason, icon = '🏆') {
            $('#modalTitle').text(title);
            $('#modalReason').text(reason);
            $('#modalIcon').text(icon);
            $('#gameOverModal').removeClass('hidden');
        }

        function updateStatus() {
            const moveColor = game.turn() === 'b' ? 'Siyah' : 'Beyaz';

            if (game.in_checkmate()) {
                $('#status').text('Şah Mat!');
                if (vsBot) {
                    if (game.turn() === 'b') {
                        showGameOverModal('Tebrikler, Kazandın!', 'Stockfish botunu şah mat ettin!', '🎉');
                    } else {
                        showGameOverModal('Kaybettin!', 'Stockfish botu seni şah mat etti.', '💀');
                    }
                } else {
                    const winner = game.turn() === 'b' ? 'Beyaz' : 'Siyah';
                    showGameOverModal(`${winner} Kazandı!`, 'Şah mat ile oyun sona erdi.', '🏆');
                }
            } else if (game.in_draw()) {
                $('#status').text('Berabere');
                showGameOverModal('Berabere!', 'Oyun beraberlik ile sonuçlandı.', '🤝');
            } else {
                let statusText = 'Sıra: ' + moveColor;
                if (game.in_check()) statusText = moveColor + ' (Şah!)';
                $('#status').text(statusText);
            }

            const activeHistory = isAnalysisMode ? moveHistoryList : game.history({ verbose: true });
            let pgnHtml = '';

            for (let i = 0; i < activeHistory.length; i += 2) {
                const round = Math.floor(i / 2) + 1;
                const activeIdx = isAnalysisMode ? currentAnalysisIdx : (liveReviewIdx !== -1 ? liveReviewIdx : activeHistory.length - 1);
                
                const whiteActive = (i === activeIdx) ? 'active-move px-1.5 py-0.5' : '';
                const blackActive = (i + 1 === activeIdx) ? 'active-move px-1.5 py-0.5' : '';

                const whiteMove = activeHistory[i].from + '→' + activeHistory[i].to;
                const blackMove = activeHistory[i + 1] ? activeHistory[i + 1].from + '→' + activeHistory[i + 1].to : '';

                pgnHtml += `
                    <div class="py-1.5 border-b border-zinc-800/50 flex justify-between gap-2 items-center">
                        <span class="text-zinc-600 font-semibold">${round}.</span>
                        <span class="text-zinc-300 font-medium cursor-pointer ${whiteActive}" onclick="jumpToMove(${i})">${whiteMove}</span>
                        <span class="text-blue-400 font-medium cursor-pointer ${blackActive}" onclick="jumpToMove(${i + 1})">${blackMove}</span>
                    </div>`;
            }

            $('#pgn').html(pgnHtml);
            const pgnDiv = document.getElementById('pgn');
            if (pgnDiv && liveReviewIdx === -1 && !isAnalysisMode) pgnDiv.scrollTop = pgnDiv.scrollHeight;
        }

        $('#modePvP').on('click', function() {
            vsBot = false;
            $('#botEloWrapper').addClass('hidden');
            $(this).addClass('bg-blue-600 text-white').removeClass('text-zinc-400');$('#modeBot').removeClass('bg-blue-600 text-white').addClass('text-zinc-400');
        });

        $('#modeBot').on('click', function() {
            vsBot = true;
            $('#botEloWrapper').removeClass('hidden');
            $(this).addClass('bg-blue-600 text-white').removeClass('text-zinc-400');$('#modePvP').removeClass('bg-blue-600 text-white').addClass('text-zinc-400');
            if (game.turn() === 'b' && !game.game_over()) {
                triggerStockfishMove();
            }
        });

        $('#flipBtn').on('click', function () {
            isFlipped = !isFlipped;
            renderBoard();
            if (isAnalysisMode && currentBestMove) {
                const from = currentBestMove.substring(0, 2);
                const to = currentBestMove.substring(2, 4);
                drawBestMoveArrow(from, to);
            }
        });

        function resetGame() {
            game.reset();
            reviewGame.reset();
            liveReviewIdx = -1;
            $('#liveReviewBanner').addClass('hidden');
            selectedSquare = null;
            whiteTime = 300; blackTime = 300;
            if (timerInterval) clearInterval(timerInterval);
            $('#gameOverModal').addClass('hidden');
            if (isAnalysisMode) exitAnalysisMode();
            updateTimerDisplay();
            renderBoard();
            updateStatus();
        }

        $('#resetBtn, #modalResetBtn').on('click', resetGame);
        $('#modalInspectBtn, #navAnalysis').on('click', startAnalysisMode);
        $('#closeModalBtn').on('click', () => $('#gameOverModal').addClass('hidden'));

        $('#undoBtn').on('click', function () {
            if (liveReviewIdx !== -1) returnToLive();
            game.undo();
            if (vsBot) game.undo();
            selectedSquare = null;
            renderBoard();
            updateStatus();
        });

        initStockfish();
        updateTimerDisplay();
        renderBoard();
        updateStatus();
    </script>
</body>
</html>
