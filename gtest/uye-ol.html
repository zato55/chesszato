<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#09090b">
  <title>Üye Ol — Chesszato</title>
  <style>
    :root{color-scheme:dark;--bg:#09090b;--panel:#121215;--line:#303036;--gold:#d6b46a;--muted:#a1a1aa}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at top,#242016 0%,var(--bg) 58%);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f4f4f5}
    .wrap{width:min(100%,440px)}.brand{text-align:center;margin-bottom:22px}.mark{font-size:38px;color:var(--gold);line-height:1}.brand-name{font-weight:900;letter-spacing:.12em;font-size:20px;margin-top:8px}.brand-name span{color:var(--gold)}.tagline{color:var(--muted);font-size:13px;margin-top:6px}
    .card{background:rgba(18,18,21,.96);border:1px solid var(--line);border-radius:22px;padding:clamp(22px,6vw,32px);box-shadow:0 24px 80px #0008}.eyebrow{color:var(--gold);font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}h1{font-size:27px;margin:8px 0 7px;letter-spacing:-.03em}.sub{font-size:14px;color:var(--muted);margin:0 0 20px;line-height:1.5}
    label{display:block;font-size:13px;font-weight:700;margin:14px 0 7px}input{width:100%;min-height:46px;border:1px solid #3f3f46;border-radius:11px;background:#09090b;color:#fafafa;padding:11px 14px;font:inherit;outline:none}input:focus{border-color:var(--gold);box-shadow:0 0 0 3px #d6b46a22}.terms{display:flex;align-items:flex-start;gap:9px;margin:18px 0;color:var(--muted);font-size:12px;line-height:1.5}.terms input{width:16px;min-height:16px;margin-top:2px;accent-color:var(--gold);flex:0 0 auto}a{color:var(--gold);text-decoration:none}a:hover{text-decoration:underline}.primary{display:flex;align-items:center;justify-content:center;width:100%;min-height:49px;border:0;border-radius:11px;background:var(--gold);color:#17130a;font-weight:900;font-size:14px;cursor:pointer}.primary:hover{filter:brightness(1.07)}.notice{margin:13px 0 0;color:#c4c4cc;font-size:12px;line-height:1.5;text-align:center}.switch{margin:19px 0 0;text-align:center;font-size:13px;color:var(--muted)}.back{display:block;text-align:center;margin-top:19px;font-size:13px;color:#d4d4d8}.status{display:none;margin-top:14px;padding:11px 12px;border:1px solid #854d0e;background:#451a0333;border-radius:10px;color:#fcd34d;font-size:12px;line-height:1.5}
    @media(max-width:380px){body{padding:16px}.card{border-radius:17px}}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="brand"><div class="mark" aria-hidden="true">♟</div><div class="brand-name">CHESS<span>ZATO</span></div><div class="tagline">Kendi satranç yolculuğunu başlat.</div></div>
    <section class="card" aria-labelledby="page-title">
      <div class="eyebrow">Chesszato topluluğu</div>
      <h1 id="page-title">Aramıza katıl.</h1>
      <p class="sub">Hesap formunu doldur. Üyelik oluşturma özelliği henüz etkin değil.</p>
      <form id="authForm">
        <label for="username">Kullanıcı adı</label>
        <input id="username" name="username" autocomplete="username" minlength="3" maxlength="24" placeholder="Satrançta kullanacağın ad" required>
        <label for="email">E-posta adresi</label>
        <input id="email" name="email" type="email" autocomplete="email" placeholder="ornek@eposta.com" required>
        <label for="password">Şifre</label>
        <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" placeholder="En az 8 karakter" required>
        <label for="passwordConfirm">Şifreyi tekrar gir</label>
        <input id="passwordConfirm" name="passwordConfirm" type="password" autocomplete="new-password" minlength="8" placeholder="Şifreni yeniden yaz" required>
        <label class="terms"><input type="checkbox" name="terms" required><span>Üyelik koşullarını ve gizlilik bilgilendirmesini okuduğumu kabul ediyorum.</span></label>
        <button class="primary" type="submit">Hesap Oluştur</button>
        <div id="status" class="status" role="status">Üyelik oluşturma henüz etkin değil. Bu sayfa şimdilik tasarım ve gezinme amacıyla hazırlanmıştır.</div>
      </form>
      <p class="switch">Zaten hesabın var mı? <a href="giris.html">Giriş yap</a></p>
    </section>
    <a class="back" href="index.html">← Oyuna geri dön</a>
  </main>
  <script>
    document.getElementById('authForm').addEventListener('submit',function(event){event.preventDefault();const password=document.getElementById('password').value;const confirm=document.getElementById('passwordConfirm').value;const status=document.getElementById('status');if(password!==confirm){status.textContent='Girdiğin şifreler eşleşmiyor.';status.style.display='block';return;}status.textContent='Üyelik oluşturma henüz etkin değil. Bu sayfa şimdilik tasarım ve gezinme amacıyla hazırlanmıştır.';status.style.display='block';});
  </script>
</body>
</html>
