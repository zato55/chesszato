<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#09090b">
  <title>Giriş Yap — Chesszato</title>
  <style>
    :root{color-scheme:dark;--bg:#09090b;--panel:#121215;--line:#303036;--gold:#d6b46a;--muted:#a1a1aa}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at top,#242016 0%,var(--bg) 58%);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f4f4f5}
    .wrap{width:min(100%,420px)}.brand{text-align:center;margin-bottom:24px}.mark{font-size:38px;color:var(--gold);line-height:1}.brand-name{font-weight:900;letter-spacing:.12em;font-size:20px;margin-top:8px}.brand-name span{color:var(--gold)}.tagline{color:var(--muted);font-size:13px;margin-top:6px}
    .card{background:rgba(18,18,21,.96);border:1px solid var(--line);border-radius:22px;padding:clamp(22px,6vw,32px);box-shadow:0 24px 80px #0008}.eyebrow{color:var(--gold);font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}h1{font-size:27px;margin:8px 0 7px;letter-spacing:-.03em}.sub{font-size:14px;color:var(--muted);margin:0 0 24px;line-height:1.5}
    label{display:block;font-size:13px;font-weight:700;margin:16px 0 8px}input{width:100%;min-height:48px;border:1px solid #3f3f46;border-radius:11px;background:#09090b;color:#fafafa;padding:12px 14px;font:inherit;outline:none}input:focus{border-color:var(--gold);box-shadow:0 0 0 3px #d6b46a22}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:16px 0 20px;font-size:12px;color:var(--muted)}.remember{display:flex;align-items:center;gap:8px}.remember input{width:15px;min-height:15px;accent-color:var(--gold)}a{color:var(--gold);text-decoration:none}a:hover{text-decoration:underline}.primary{display:flex;align-items:center;justify-content:center;width:100%;min-height:49px;border:0;border-radius:11px;background:var(--gold);color:#17130a;font-weight:900;font-size:14px;cursor:pointer}.primary:hover{filter:brightness(1.07)}.notice{margin:14px 0 0;color:#c4c4cc;font-size:12px;line-height:1.5;text-align:center}.switch{margin:20px 0 0;text-align:center;font-size:13px;color:var(--muted)}.back{display:block;text-align:center;margin-top:20px;font-size:13px;color:#d4d4d8}.status{display:none;margin-top:14px;padding:11px 12px;border:1px solid #854d0e;background:#451a0333;border-radius:10px;color:#fcd34d;font-size:12px;line-height:1.5}
    @media(max-width:380px){body{padding:16px}.card{border-radius:17px}.row{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="brand"><div class="mark" aria-hidden="true">♟</div><div class="brand-name">CHESS<span>ZATO</span></div><div class="tagline">Bir sonraki hamlen burada başlar.</div></div>
    <section class="card" aria-labelledby="page-title">
      <div class="eyebrow">Oyuncu hesabı</div>
      <h1 id="page-title">Tekrar hoş geldin.</h1>
      <p class="sub">Chesszato hesabına giriş yapmak için bilgilerini gir.</p>
      <form id="authForm">
        <label for="identity">E-posta veya kullanıcı adı</label>
        <input id="identity" name="identity" autocomplete="username" placeholder="Kullanıcı adın veya e-posta adresin" required>
        <label for="password">Şifre</label>
        <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Şifren" required>
        <div class="row"><label class="remember" style="margin:0"><input type="checkbox" name="remember"> Beni hatırla</label><a href="#" id="forgotLink">Şifremi unuttum</a></div>
        <button class="primary" type="submit">Giriş Yap</button>
        <div id="status" class="status" role="status">Giriş doğrulaması henüz etkin değil. Bu sayfa şimdilik tasarım ve gezinme amacıyla hazırlanmıştır.</div>
      </form>
      <p class="switch">Henüz hesabın yok mu? <a href="uye-ol.html">Üye ol</a></p>
    </section>
    <a class="back" href="index.html">← Oyuna geri dön</a>
  </main>
  <script>
    document.getElementById('authForm').addEventListener('submit',function(event){event.preventDefault();document.getElementById('status').style.display='block';});
    document.getElementById('forgotLink').addEventListener('click',function(event){event.preventDefault();const status=document.getElementById('status');status.textContent='Şifre sıfırlama henüz etkin değil; gerçek üyelik sistemi kurulduğunda eklenecek.';status.style.display='block';});
  </script>
</body>
</html>
