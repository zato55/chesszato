<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 254" preserveAspectRatio="xMidYMid slice">
<defs>
 <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#090d18"/><stop offset=".58" stop-color="#15101a"/><stop offset="1" stop-color="#030509"/></linearGradient>
 <radialGradient id="halo"><stop stop-color="#ff526d" stop-opacity=".34"/><stop offset=".48" stop-color="#a80f31" stop-opacity=".13"/><stop offset="1" stop-color="#080a12" stop-opacity="0"/></radialGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff0c2"/><stop offset=".28" stop-color="#d8a85e"/><stop offset=".62" stop-color="#75421f"/><stop offset="1" stop-color="#f8d995"/></linearGradient>
 <linearGradient id="ivory" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff7e8"/><stop offset=".4" stop-color="#c8b9a7"/><stop offset="1" stop-color="#5e4b4c"/></linearGradient>
 <linearGradient id="board" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#49202b"/><stop offset="1" stop-color="#080b13"/></linearGradient>
 <pattern id="tiles" width="88" height="44" patternUnits="userSpaceOnUse"><rect width="88" height="44" fill="#10131d"/><path d="M0 0h44v22H0zM44 22h44v22H44z" fill="#8f253c" opacity=".55"/></pattern>
 <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="9"/></filter>
 <filter id="pieceGlow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <linearGradient id="vignette" x2="0" y2="1"><stop stop-color="#03050a" stop-opacity=".06"/><stop offset=".72" stop-color="#03050a" stop-opacity=".12"/><stop offset="1" stop-color="#03050a" stop-opacity=".92"/></linearGradient>
</defs>
<!-- Cinematic chess hall -->
<rect width="720" height="254" fill="url(#bg)"/>
<ellipse cx="360" cy="110" rx="310" ry="165" fill="url(#halo)"/>
<path d="M360 -35L80 190M360 -35L180 190M360 -35L270 190M360 -35L450 190M360 -35L540 190M360 -35L650 190" stroke="#f5c987" stroke-opacity=".12" stroke-width="1"/>
<path d="M0 54Q170 4 360 48T720 54M0 82Q170 32 360 76T720 82" fill="none" stroke="#f2c78b" stroke-opacity=".09"/>
<g opacity=".45" fill="#ffb4bf"><circle cx="80" cy="42" r="1.4"/><circle cx="142" cy="75" r="1"/><circle cx="220" cy="30" r="1.2"/><circle cx="510" cy="40" r="1.3"/><circle cx="605" cy="76" r="1"/><circle cx="666" cy="30" r="1.4"/></g>
<ellipse cx="360" cy="204" rx="340" ry="45" fill="#ed2348" opacity=".18" filter="url(#softGlow)"/>
<!-- Perspective board -->
<path d="M-45 143L365 93L765 143L720 254H0Z" fill="url(#board)" stroke="#c78d62" stroke-opacity=".42" stroke-width="2"/>
<path d="M-25 151L365 105L745 151L708 254H12Z" fill="url(#tiles)" opacity=".72"/>
<path d="M-25 151L365 105L745 151M12 254L708 254M68 145L76 254M155 135L168 254M250 124L260 254M365 105L360 254M480 124L462 254M575 135L555 254M660 145L636 254" fill="none" stroke="#d7a56f" stroke-opacity=".25" stroke-width="1"/>
<path d="M0 248L720 248" stroke="#ff3456" stroke-opacity=".5" stroke-width="2" filter="url(#pieceGlow)"/>
<!-- Distant pieces -->
<g font-family="Georgia,serif" text-anchor="middle" filter="url(#pieceGlow)" fill="url(#ivory)" stroke="#f5d9b4" stroke-opacity=".52">
 <text x="106" y="164" font-size="56" opacity=".7">♞</text>
 <text x="590" y="166" font-size="58" opacity=".68">♜</text>
 <text x="205" y="151" font-size="43" opacity=".48">♟</text>
 <text x="512" y="151" font-size="44" opacity=".5">♝</text>
</g>
<!-- Hero king silhouette -->
<g transform="translate(360 0)" filter="url(#pieceGlow)">
 <ellipse cx="0" cy="206" rx="83" ry="13" fill="#ff3155" opacity=".36" filter="url(#softGlow)"/>
 <path d="M-48 194L-39 176L-28 170L-21 133L-31 121L-25 111L-12 116L-5 99L-13 89L-7 80L0 87L7 80L13 89L5 99L12 116L25 111L31 121L21 133L28 170L39 176L48 194Z" fill="url(#gold)" stroke="#ffe3b1" stroke-width="1.6"/>
 <path d="M-28 169Q0 179 28 169L34 185Q0 195 -34 185Z" fill="#6d2633" opacity=".88"/>
 <path d="M-20 133Q0 141 20 133M-12 116L0 121L12 116" fill="none" stroke="#fff0c7" stroke-opacity=".75" stroke-width="1.5"/>
 <path d="M-8 83H8M0 75V91" stroke="#fff4d8" stroke-width="4" stroke-linecap="round"/>
 <path d="M-42 195H42" stroke="#fbe3b7" stroke-width="2"/>
</g>
<!-- Dramatic rim lights -->
<path d="M330 88Q360 66 390 88" fill="none" stroke="#fff0ce" stroke-opacity=".8" stroke-width="1.5" filter="url(#pieceGlow)"/>
<path d="M285 195Q360 215 435 195" fill="none" stroke="#ff3557" stroke-opacity=".72" stroke-width="2" filter="url(#pieceGlow)"/>
<rect width="720" height="254" fill="url(#vignette)"/>
</svg>