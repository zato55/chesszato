<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09090b"><title>Konumda Oyna — Chesszato</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#09090b;color:#f4f4f5;font-family:system-ui,sans-serif}.page{max-width:1000px;margin:auto;padding:14px}header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}h1{font-size:24px;margin:0}a,.btn{color:#fff;background:#202024;border:1px solid #3f3f46;border-radius:9px;padding:10px 12px;text-decoration:none;font-weight:700;font-size:13px}.layout{display:grid;grid-template-columns:minmax(0, min(68vh,650px)) minmax(220px,1fr);gap:16px;justify-content:center;align-items:start}#board{width:100%;aspect-ratio:1;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr));border:2px solid #3f3f46;overflow:hidden}.sq{position:relative;min-width:0;min-height:0;padding:0;border:0;border-radius:0;display:flex;align-items:center;justify-content:center;appearance:none}.light{background:#f0d9b5}.dark{background:#b58863}.sq img{width:92%;height:92%;object-fit:contain;pointer-events:none}.sq.selected{box-shadow:inset 0 0 0 4px #facc15}.sq.target:after{content:"";position:absolute;width:24%;height:24%;border-radius:50%;background:#166534aa}.sq.capture:after{content:"";position:absolute;inset:3px;border:4px solid #166534aa;border-radius:50%}.coord{position:absolute;font-size:10px;font-weight:900;pointer-events:none}.file{right:3px;bottom:2px}.rank{left:3px;top:2px}.light .coord{color:#7c4a2a}.dark .coord{color:#fff}.panel{background:#151518;border:1px solid #303036;border-radius:12px;padding:14px;min-width:0}.status{font-weight:800;margin:0 0 10px;min-height:42px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions button{min-height:40px}.fen{font-size:11px;overflow-wrap:anywhere;color:#a1a1aa;margin-top:12px}.board-wrap{min-width:0;width:100%}.moves-title{margin:9px 0 5px;font-size:10px;font-weight:900;letter-spacing:.12em;color:#fb7185}.moves{display:flex;align-items:center;gap:5px;min-height:42px;width:100%;overflow-x:auto;overflow-y:hidden;padding:5px 6px;border:1px solid #34343a;border-radius:9px;background:#101014;color:#f4f4f5;scrollbar-width:thin;scrollbar-color:#52525b #101014;-webkit-overflow-scrolling:touch}.move-chip{flex:0 0 auto;display:flex;align-items:center;gap:5px;min-height:28px;padding:4px 7px;border-radius:6px;background:#202024;font-size:12px;white-space:nowrap}.move-no{font-size:10px;color:#a1a1aa;font-weight:800}.move-san{font-weight:850;font-variant-numeric:tabular-nums}.move-san.black{color:#d4d4d8}.move-chip.latest{background:#4a1522;box-shadow:inset 0 0 0 1px #fb7185;color:#fff}.moves-empty{flex:0 0 auto;padding:6px 7px;color:#a1a1aa;font-size:11px}.panel .moves-title,.panel .moves{display:none}@media(max-width:700px){.page{padding:10px}.layout{grid-template-columns:minmax(0,1fr);gap:12px}#board{width:min(100%,calc(100vw - 20px));margin:auto}.panel{padding:12px}h1{font-size:20px}}
</style></head><body><main class="page"><header><h1>Konumda Oyna</h1><a href="freeboard.html">‹ Konum düzenle</a></header><div class="layout"><div class="board-wrap"><div id="board" aria-label="Satranç tahtası"></div><div class="moves-title">HAMLELER</div><div id="moves" class="moves" aria-label="Oynanan hamleler" aria-live="polite"></div></div><aside class="panel"><p id="status" class="status">Tahta yükleniyor…</p><div class="actions"><button class="btn" id="undo">↶ Geri al</button><button class="btn" id="restart">Konumu sıfırla</button><button class="btn" id="flip">Tahtayı çevir</button><button class="btn" id="copy">FEN kopyala</button></div><div id="fen" class="fen"></div></aside></div></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script><script>
(function(){
const board=document.getElementById('board'),status=document.getElementById('status'),fenBox=document.getElementById('fen'),movesBox=document.getElementById('moves');
const params=new URLSearchParams(location.search),startFen=params.get('fen');let game,baseFen,flipped=false,selected=null,targets=[];
function say(s){status.textContent=s}
function url(p){return 'https://images.chesscomfiles.com/chess-themes/pieces/neo/300/'+(p.color==='w'?'w':'b')+p.type+'.png'}
function render(){
 board.replaceChildren();const files=flipped?[7,6,5,4,3,2,1,0]:[0,1,2,3,4,5,6,7],ranks=flipped?[0,1,2,3,4,5,6,7]:[7,6,5,4,3,2,1,0];
 ranks.forEach((rankIndex,ri)=>files.forEach((fileIndex,ci)=>{const sqName='abcdefgh'[fileIndex]+(rankIndex+1),p=game.get(sqName),el=document.createElement('button');el.type='button';el.className='sq '+((rankIndex+fileIndex)%2?'dark':'light');if(selected===sqName)el.classList.add('selected');const target=targets.find(m=>m.to===sqName);if(target)el.classList.add(p?'capture':'target');if(p){const im=document.createElement('img');im.src=url(p);im.alt=p.color+p.type;im.draggable=false;el.appendChild(im)}if(ri===7){const x=document.createElement('small');x.className='coord file';x.textContent='abcdefgh'[fileIndex];el.appendChild(x)}if(ci===0){const x=document.createElement('small');x.className='coord rank';x.textContent=String(rankIndex+1);el.appendChild(x)}el.addEventListener('click',()=>tap(sqName));board.appendChild(el)}));
 fenBox.textContent='FEN: '+game.fen();
 movesBox.replaceChildren();
 const history=game.history({verbose:true});
 if(!history.length){const empty=document.createElement('span');empty.className='moves-empty';empty.textContent='Henüz hamle yok';movesBox.appendChild(empty)}
 else {
   for(let i=0;i<history.length;i++){
     const chip=document.createElement('span');chip.className='move-chip'+(i===history.length-1?' latest':'');
     if(history[i].color==='w'){const no=document.createElement('span');no.className='move-no';no.textContent=(Math.floor(i/2)+1)+'.';chip.appendChild(no)}
     const san=document.createElement('span');san.className='move-san'+(history[i].color==='b'?' black':'');san.textContent=history[i].san;chip.appendChild(san);
     movesBox.appendChild(chip);
   }
   movesBox.scrollLeft=movesBox.scrollWidth;
 }
 if(game.game_over()){if(game.in_checkmate())say('Şah mat! '+(game.turn()==='w'?'Siyah':'Beyaz')+' kazandı.');else if(game.in_stalemate())say('Pat! Berabere.');else say('Oyun sona erdi.');}
 else say((game.turn()==='w'?'Beyaz':'Siyah')+' oynuyor'+(game.in_check()?' — ŞAH!':'')+'. Taş seçip hedef kareye dokun.');
}
function tap(sq){const p=game.get(sq);if(selected){const move=targets.find(m=>m.to===sq);if(move){const result=game.move({from:selected,to:sq,promotion:'q'});selected=null;targets=[];if(result){render();return}}}if(p&&p.color===game.turn()){selected=sq;targets=game.moves({square:sq,verbose:true});}else{selected=null;targets=[]}render()}
try{if(!window.Chess)throw new Error('Satranç kütüphanesi yüklenemedi. İnternet bağlantısını kontrol edip yenile.');if(!startFen)throw new Error('Konum bilgisi URL içinde bulunamadı. Serbest Tahta’ya dönüp yeniden dene.');game=new Chess(startFen);if(game.load(startFen)===false)throw new Error('FEN konumu geçersiz. Taşların yerleşimini kontrol et.');baseFen=startFen;render()}catch(e){say(e.message);board.replaceChildren()}
document.getElementById('undo').addEventListener('click',()=>{if(game&&game.history().length){game.undo();selected=null;targets=[];render()}});
document.getElementById('restart').addEventListener('click',()=>{if(game){game=new Chess(baseFen);selected=null;targets=[];render()}});
document.getElementById('flip').addEventListener('click',()=>{flipped=!flipped;render()});
document.getElementById('copy').addEventListener('click',async()=>{if(!game)return;try{await navigator.clipboard.writeText(game.fen());say('Güncel FEN panoya kopyalandı.')}catch(e){say('FEN metni yukarıda görünüyor; kopyalamak için seç.')}});
})();
</script></body></html>
